<title>Análisis compras y ventas, SIRE, PDT 621 2024</title>

<style>
/* Layout: banda superior azul SUNAT-like con pasos tipo expediente; tarjetas solo para cada pregunta/mes. */
:root{
  --bg:#f2f4f7;--card:#ffffff;--ink:#17202e;--mute:#5d6878;--line:#d8dee7;--pri:#1f4e79;--pri-ink:#ffffff;--soft:#e7eef6;
  --input:#fffdf2;--hi:#f2b705;--hi-ink:#17202e;
  --ok:#17784a;--okbg:#e3f3ea;--warn:#a85a00;--warnbg:#fdf0dc;--bad:#b42318;--badbg:#fbe6e4;--na:#eceff3;
  --sans:"IBM Plex Sans",Arial,Helvetica,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151d;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b6;--line:#2c3746;--pri:#3b78b3;--pri-ink:#ffffff;--soft:#1f2c3c;
  --input:#1d2530;--hi:#f2b705;--hi-ink:#17202e;
  --ok:#5cc58e;--okbg:#173527;--warn:#f0a548;--warnbg:#3a2a12;--bad:#f07c72;--badbg:#3d1c1a;--na:#232c38;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151d;--card:#18202b;--ink:#e6ebf2;--mute:#9aa6b6;--line:#2c3746;--pri:#3b78b3;--pri-ink:#ffffff;--soft:#1f2c3c;
  --input:#1d2530;--hi:#f2b705;--hi-ink:#17202e;
  --ok:#5cc58e;--okbg:#173527;--warn:#f0a548;--warnbg:#3a2a12;--bad:#f07c72;--badbg:#3d1c1a;--na:#232c38;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
.band{background:var(--pri);color:var(--pri-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.band .in{max-width:1100px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.band h1{font-size:18px;margin:0;flex:1 1 320px;text-wrap:balance}
.band small{display:block;font-weight:400;opacity:.85;font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit}
.btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--hi);outline-offset:2px}
.btn.pri{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.btn.sm{padding:5px 10px;font-size:13px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
nav.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav.steps button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:20px;cursor:pointer;font:inherit;font-size:13px}
nav.steps button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px;min-width:0}
.card h2{font-size:16px;margin:0 0 4px}
.card h3{font-size:14.5px;margin:0 0 8px}
.mute{color:var(--mute)}
.pill{display:inline-block;padding:1px 9px;border-radius:12px;font-size:12px;font-weight:700;letter-spacing:.02em}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.na{background:var(--na);color:var(--mute)}
.tw{overflow-x:auto}
table.num{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0;font-variant-numeric:tabular-nums}
table.num th,table.num td{border-bottom:1px solid var(--line);padding:4px 8px;text-align:right;white-space:nowrap}
table.num td{font-family:var(--sans);font-size:13px}
table.num th:first-child,table.num td:first-child{text-align:left;font-family:var(--sans)}
table.num th{background:var(--soft);font-weight:600}
td.dif{font-weight:600}td.dif.bad{color:var(--bad)}
.q{margin:10px 0}
.q label.t{display:block;font-weight:600;margin-bottom:4px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts label{border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;background:var(--card)}
.opts input{margin-right:4px}
.opts label.sel{border-color:var(--pri);background:var(--soft)}
textarea,input[type=text],input[type=date],select{width:100%;font:inherit;color:var(--ink);padding:7px;border:1px solid var(--line);border-radius:6px;background:var(--input)}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mesbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.mesbar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 8px;cursor:pointer;font:inherit;min-width:54px}
.mesbar button.on{outline:2px solid var(--pri)}
.mesbar button.st-ok{background:var(--okbg)}.mesbar button.st-obs{background:var(--badbg)}.mesbar button.st-rev{background:var(--warnbg)}.mesbar button.st-na{color:var(--mute);opacity:.5}
.obsauto{background:var(--soft);border-left:3px solid var(--pri);padding:8px 10px;margin:8px 0;font-size:13px}
.progress{height:8px;background:var(--na);border-radius:4px;overflow:hidden;margin-top:6px}
.progress div{height:100%;background:var(--ok)}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.doc{display:grid;grid-template-columns:1fr 160px;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:7px 0}
.sync{font-size:12px;opacity:.9}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20}
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#lock[hidden]{display:none!important}
.lockbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.lockbox h1{font-size:20px;margin:0;color:var(--pri)}
.lockbox p{margin:0}
.lockbox .t{font-weight:600}
.lockbox input[type=password]{width:100%;font:inherit;color:var(--ink);padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--input)}
.lockbox .rec{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
.lockmsg{color:var(--bad);font-size:13px}
.ger{border-left:4px solid var(--warn)}
.ger h2{font-size:18px;color:var(--warn);text-wrap:balance}
.ger p{font-size:14.5px;max-width:75ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:10px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--soft);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:12.5px;color:var(--mute)}
.kpi b{font-size:19px;font-variant-numeric:tabular-nums}
.kpi small{font-size:11.5px;color:var(--mute)}
details{margin-top:8px}details summary{cursor:pointer;color:var(--pri);font-size:13px}
.inf{border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0 12px;background:var(--soft)}
.inf h3{margin:0 0 8px}
.infgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.infgrid > div{min-width:0}
.infgrid ul{margin:4px 0 0;padding-left:18px;font-size:13.5px}
.infgrid p{margin:4px 0 0;font-size:13.5px}
.halltabs button{display:flex;gap:8px;align-items:center}
.mres tr{cursor:pointer}.mres tr:hover td{background:var(--soft)}.mres tr.sel td{background:var(--soft);font-weight:600}.mres td:nth-child(2),.mres td:nth-child(4){text-align:left}
.hres td:nth-child(3){text-align:left;white-space:normal}
.okc{color:var(--ok)}.badc{color:var(--bad)}
@media (max-width:700px){.infgrid{grid-template-columns:1fr}}
.opgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opgrid p{margin:4px 0 0;font-size:13.5px}
.opgrid > div{min-width:0}
@media (max-width:800px){.opgrid{grid-template-columns:1fr}}
.caps{margin:14px 0 6px;border-top:1px solid var(--line);padding-top:12px}
.captabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.captabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;font-size:12.5px}
.captabs button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.capnote{font-size:12px;margin:0 0 6px}
.capimg{border:1px solid var(--line);border-radius:6px;background:#fff;overflow:auto;max-height:80vh}
.capimg img{display:block;width:100%;height:auto;cursor:zoom-in}
#zoom{position:fixed;inset:0;z-index:30;background:rgba(10,14,20,.88);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#zoom[hidden]{display:none!important}
#zoom .zbar{display:flex;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px));color:#fff;flex-wrap:wrap}
#zoom .zt{flex:1;font-weight:600}
#zoom .zbody{flex:1;overflow:auto;padding:0 16px 16px}
#zoom img{background:#fff;display:block;max-width:none}
#zoom img.fit{max-width:100%;height:auto}
@media (max-width:700px){.grid2{grid-template-columns:1fr}.doc{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

(function () {
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const enc = new TextEncoder();
  async function derivar(pw) {
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(window.__ENC.salt), iterations: window.__ENC.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
  }
  const cache = {};
  window.imgURL = async src => {
    if (cache[src]) return cache[src];
    const buf = new Uint8Array(await (await fetch(src)).arrayBuffer());
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: buf.slice(0, 12)}, window.__K, buf.slice(12));
    return cache[src] = URL.createObjectURL(new Blob([plain], {type: 'image/jpeg'}));
  };
  async function abrir(pw, recordar) {
    const key = await derivar(pw);
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(window.__ENC.iv)}, key, b64(window.__ENC.ct));
    const obj = JSON.parse(new TextDecoder().decode(plain));
    window.__K = key; window.__D = obj.DATA; window.__C = obj.CAPS; window.__PW = pw;
    try { if (recordar) localStorage.setItem('itan-pw', pw); else localStorage.removeItem('itan-pw'); } catch (e) {}
    document.getElementById('lock').hidden = true;
    const s = document.createElement('script'); s.textContent = obj.APP; document.body.appendChild(s);

  const msg = t => { const m = document.getElementById('lockmsg'); m.textContent = t; m.hidden = !t; };
  document.getElementById('lockf').addEventListener('submit', ev => {
    ev.preventDefault(); msg('Abriendo…');
    abrir(document.getElementById('pw').value, document.getElementById('rec').checked).then(() => msg('')).catch(() => msg('Clave incorrecta. Revisa mayúsculas y símbolos.'));
  });
  let guardada = null; try { guardada = localStorage.getItem('itan-pw'); } catch (e) {}
  if (guardada) abrir(guardada, true).catch(() => { try { localStorage.removeItem('itan-pw'); } catch (e) {} });
})();
